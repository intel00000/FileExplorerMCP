[project]
name = "filebridge-mcp"
version = "0.1.0"
description = "An MCP server that exposes one folder to a vision-language model — explore, read (projected to text/images), write, search, and timestamp-addressed video frame extraction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tom Tan" }]
keywords = ["mcp", "vlm", "vision-language-model", "filesystem", "ffmpeg"]

# Core is the MCP SDK only; everything else degrades gracefully (design D6).
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.optional-dependencies]
# Image downscaling (caps vision-encoder cost). Without it, images return at native size.
image = ["pillow>=10.0.0"]
# PDF text extraction + page rasterization. Without it, PDF tools return an actionable error.
pdf = ["pymupdf>=1.24.0"]
# Everything optional that is pip-installable (ffmpeg is a system binary, not here).
all = ["pillow>=10.0.0", "pymupdf>=1.24.0"]

[project.scripts]
filebridge-mcp = "filebridge_mcp.server:main"

[project.urls]
Homepage = "https://modelcontextprotocol.io"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filebridge_mcp"]

# uv-native dev dependencies: `uv sync` installs these for local work.
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
