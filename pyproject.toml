[project]
name = "filebridge-mcp"
version = "0.1.0"
description = "An MCP server that exposes one folder to a vision-language model — explore, read (projected to text/images), write, search, and timestamp-addressed video frame extraction."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tom Tan" }]
keywords = ["mcp", "vlm", "vision-language-model", "filesystem", "ffmpeg"]

# Core is the MCP SDK only; everything else degrades gracefully (design D6).
dependencies = [
    "mcp[cli]>=1.28.0",
    "pydantic>=2.13.4",
]

[project.scripts]
filebridge-mcp = "filebridge_mcp.server:main"

[project.urls]
Homepage = "https://modelcontextprotocol.io"

[project.optional-dependencies]
# Image downscaling + contact-sheet composition. Without it, images return at native size.
image = [
    "pillow>=12.2.0",
]
# PDF text extraction + page rasterization. Without it, PDF tools return an actionable error.
pdf = [
    "pymupdf>=1.27.2.3",
]
# Everything pip-installable (ffmpeg is a system binary, not here). Self-references the
# extras above so versions live in one place: `uv sync --extra all` / `pip install .[all]`.
all = [
    "filebridge-mcp[image,pdf]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filebridge_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
